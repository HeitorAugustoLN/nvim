name: Update plugins
run-name: Update plugins by ${{ github.actor }}
on:
  schedule:
    - cron: "0 0 * * 1" # Every week on monday at midnight UTC
  workflow_dispatch:
jobs:
  update-plugins:
    timeout-minutes: 11
    name: Update plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: cachix/install-nix-action@4e002c8ec80594ecd40e759629461e26c8abed15 # v31.9.0
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure Git
        run: |
          git config user.name "heitor-bot[bot]"
          git config user.email "246902415+heitor-bot[bot]@users.noreply.github.com"
      - name: Update plugins
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Updating start plugins..."
          # Capture output and exit code. || true prevents the script from exiting here.
          start_output=$(nix develop --quiet --command just update-plugins start --full 2>&1) || start_failed=1
          
          echo "Updating opt plugins..."
          opt_output=$(nix develop --quiet --command just update-plugins opt --full 2>&1) || opt_failed=1

          # Print outputs to the log so you can actually see what went wrong
          echo "--- Start Plugins Log ---"
          echo "$start_output"
          echo "--- Optional Plugins Log ---"
          echo "$opt_output"

          # If both failed, something is fundamentally wrong with the dev shell or justfile
          if [ "$start_failed" == "1" ] && [ "$opt_failed" == "1" ]; then
            echo "Error: Both plugin update commands failed."
            exit 1
          fi

          combined_output="Start plugins:\n$start_output\n\nOptional plugins:\n$opt_output"

          {
            echo "output<<EOF"
            echo -e "$combined_output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        id: pull-request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          body: |
            ## Plugin updates

            ```
            ${{ steps.update.outputs.output }}
            ```
          branch: update-plugins
          commit-message: |
            feat: update plugins

            ${{ steps.update.outputs.output }}
          delete-branch: true
          labels: |
            dependencies
            neovim
          sign-commits: true
          title: "feat: update plugins"
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
