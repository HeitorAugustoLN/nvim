name: Update plugins
run-name: Update plugins by ${{ github.actor }}
on:
  schedule:
    - cron: "0 0 * * 1" # Every week on monday at midnight UTC
  workflow_dispatch:
jobs:
  update-plugins:
    timeout-minutes: 11
    name: Update plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Configure Git
        run: |
          git config user.name "heitor-bot[bot]"
          git config user.email "246902415+heitor-bot[bot]@users.noreply.github.com"
      - name: Update plugins
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Updating start plugins..."
          start_output=$(nix run --quiet nixpkgs#npins -- --lock-file start-plugins.json update --full 2>&1)
          echo "Updating opt plugins..."
          opt_output=$(nix run --quiet nixpkgs#npins -- --lock-file opt-plugins.json update --full 2>&1)

          combined_output="Start plugins:\n$start_output\n\nOptional plugins:\n$opt_output"

          {
            echo "output<<EOF"
            echo -e "$combined_output"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create Pull Request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          body: |
            ## Plugin updates

            ```
            ${{ steps.update.outputs.output }}
            ```
          branch: update-plugins
          commit-message: |
            feat: update plugins

            ${{ steps.update.outputs.output }}
          delete-branch: true
          labels: |
            dependencies
            neovim
          sign-commits: true
          title: "feat: update plugins"
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash --delete-branch "$PR_URL"
